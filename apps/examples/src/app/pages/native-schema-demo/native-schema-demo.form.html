<ngx-card>
  <form
    ngxVestForm
    #vestForm="ngxVestForm"
    [suite]="suite()"
    [formContract]="contract()"
    [formValue]="formValue()"
    (formValueChange)="formValueChange.emit($event)"
    (errorsChange)="currentErrors.set($event)"
    (ngSubmit)="onSubmit()"
    class="space-y-8"
  >
    <ngx-form-section
      tone="blue"
      title="Personal Information"
      description="These fields are typed by a native Vest schema and validated in the UI by Vest test() rules."
    >
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <ngx-control-wrapper class="form-field" ariaRequired>
          <label for="nativeFirstName">
            <span class="label-text">First Name</span>
            <input
              class="input-field"
              type="text"
              id="nativeFirstName"
              name="firstName"
              [ngModel]="formValue().firstName"
              placeholder="Enter first name"
            />
          </label>
        </ngx-control-wrapper>

        <ngx-control-wrapper class="form-field" ariaRequired>
          <label for="nativeLastName">
            <span class="label-text">Last Name</span>
            <input
              class="input-field"
              type="text"
              id="nativeLastName"
              name="lastName"
              [ngModel]="formValue().lastName"
              placeholder="Enter last name"
            />
          </label>
        </ngx-control-wrapper>
      </div>

      <ngx-control-wrapper class="form-field" ariaRequired>
        <label for="nativeEmail">
          <span class="label-text">Email</span>
          <input
            class="input-field"
            type="email"
            id="nativeEmail"
            name="email"
            [ngModel]="formValue().email"
            placeholder="user&#64;example.com"
            autocomplete="email"
            spellcheck="false"
          />
        </label>
      </ngx-control-wrapper>

      <ngx-control-wrapper class="form-field" ariaRequired>
        <label for="nativeAge">
          <span class="label-text">Age</span>
          <input
            class="input-field"
            type="number"
            id="nativeAge"
            name="age"
            [ngModel]="formValue().age"
            placeholder="Must be 18-120"
            inputmode="numeric"
          />
        </label>
      </ngx-control-wrapper>
    </ngx-form-section>

    <ngx-form-section
      tone="teal"
      title="Address"
      description="The nested address object is shaped by the schema, while field-level rules still control requiredness and business messages."
    >
      <ngx-form-group-wrapper ngModelGroup="address">
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
          <ngx-control-wrapper class="form-field sm:col-span-2" ariaRequired>
            <label for="nativeStreet">
              <span class="label-text">Street</span>
              <input
                class="input-field"
                type="text"
                id="nativeStreet"
                name="street"
                [ngModel]="formValue().address?.street"
                placeholder="Enter street address"
                autocomplete="address-line1"
              />
            </label>
          </ngx-control-wrapper>

          <ngx-control-wrapper class="form-field" ariaRequired>
            <label for="nativeCity">
              <span class="label-text">City</span>
              <input
                class="input-field"
                type="text"
                id="nativeCity"
                name="city"
                [ngModel]="formValue().address?.city"
                placeholder="Enter city"
                autocomplete="address-level2"
              />
            </label>
          </ngx-control-wrapper>

          <ngx-control-wrapper class="form-field" ariaRequired>
            <label for="nativeZipCode">
              <span class="label-text">ZIP Code</span>
              <input
                class="input-field"
                type="text"
                id="nativeZipCode"
                name="zipCode"
                [ngModel]="formValue().address?.zipCode"
                placeholder="4-6 digits"
                autocomplete="postal-code"
                spellcheck="false"
              />
            </label>
          </ngx-control-wrapper>
        </div>
      </ngx-form-group-wrapper>
    </ngx-form-section>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</ngx-card>
