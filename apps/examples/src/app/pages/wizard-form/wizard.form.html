@let step = currentStep();
@switch (step) {
  @case (1) {
    <ngx-wizard-step1-form
      [(data)]="step1Data"
      [(valid)]="step1Valid"
      [suite]="step1Suite()"
      [validationConfig]="step1ValidationConfig()"
      (stepSubmit)="step1Submit.emit($event)"
    />
  }
  @case (2) {
    <ngx-wizard-step2-form
      [(data)]="step2Data"
      [(valid)]="step2Valid"
      [suite]="step2Suite()"
      [validationConfig]="step2ValidationConfig()"
      (previous)="previousStep.emit()"
      (stepSubmit)="step2Submit.emit($event)"
    />
  }
  @case (3) {
    <ngx-wizard-step3-form
      [step1Data]="step1Data()"
      [step2Data]="step2Data()"
      [(data)]="step3Data"
      [(valid)]="step3Valid"
      [suite]="step3Suite()"
      [isSubmitting]="isSubmitting()"
      (goToStep)="goToStep.emit($event)"
      (previous)="previousStep.emit()"
      (stepSubmit)="step3Submit.emit($event)"
      (submitAll)="submitAll.emit()"
    />
  }
  @default never;
}
