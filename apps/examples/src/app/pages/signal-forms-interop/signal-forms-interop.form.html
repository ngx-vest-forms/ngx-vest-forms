<form
  ngxVestForm
  #vestForm="ngxVestForm"
  [suite]="suite()"
  [formValue]="formValue()"
  (formValueChange)="formValueChange.emit($event)"
  (submitSettled)="submitted.emit($event)"
  class="space-y-6"
>
  <!--
    A Signal Forms FormValueControl bound with plain [ngModel]. There is no
    ControlValueAccessor: NgModel binds the control's value model and touch
    output itself. [disabled] goes to NgModel, which disables the control and
    writes the disabled state into the component's disabled input.

    On this custom-control path Angular 22.2 does not attach the element's
    validators to the control; ngx-vest-forms attaches them itself, so Vest
    validates the field with no extra directive.
  -->
  <ngx-control-wrapper class="form-field">
    <label for="seats" class="label-text">Seats</label>
    <p id="seats-hint" class="mb-2 text-sm text-gray-600 dark:text-gray-300">
      Between 1 and 8. Use the buttons, type a number, or press Arrow Up and
      Arrow Down.
    </p>
    <ngx-seat-stepper
      name="seats"
      inputId="seats"
      hintId="seats-hint"
      [ngModel]="formValue().seats"
      [disabled]="formValue().lockSeats === true"
    />
  </ngx-control-wrapper>

  <div class="flex items-center gap-2">
    <input
      id="lockSeats"
      name="lockSeats"
      type="checkbox"
      class="text-primary-600 focus:ring-primary-500 h-4 w-4 rounded border-gray-300 dark:border-gray-600 dark:bg-gray-700"
      [ngModel]="formValue().lockSeats"
    />
    <label
      for="lockSeats"
      class="text-sm font-medium text-gray-700 dark:text-gray-300"
    >
      Lock the seat count (disables the stepper)
    </label>
  </div>

  <!--
    A Signal Forms FormCheckboxControl: NgModel binds its checked model.
    "Must be checked" is a Vest test: Angular's required attribute does not
    mean that on a custom checkbox control.
  -->
  <ngx-control-wrapper class="form-field">
    <div class="flex items-center gap-3">
      <ngx-consent-switch
        name="acceptTerms"
        switchId="acceptTerms"
        [ngModel]="formValue().acceptTerms"
      />
      <label
        for="acceptTerms"
        class="text-sm font-medium text-gray-700 dark:text-gray-300"
      >
        I accept the booking terms
      </label>
    </div>
  </ngx-control-wrapper>

  <div class="flex justify-end gap-3 pt-2">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="resetRequested.emit()"
    >
      Reset
    </button>
    <button type="submit" class="btn btn-primary">Book seats</button>
  </div>
</form>
