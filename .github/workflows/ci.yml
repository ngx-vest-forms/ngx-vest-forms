name: CI
on:
  # Pushes to the long-lived branches give every merge a post-merge run and
  # seed the pnpm store cache that pull requests restore (ADR-0011).
  push:
    branches:
      - master
      - 'release/**'
      - beta
      - rc
  pull_request:
    branches:
      - master
      - 'release/**'
      - beta
      - rc

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        # Reads pnpm from packageManager and Node.js from .node-version, and
        # verifies the pnpm binary against npm's signature. install: false —
        # the install step below runs under the Socket firewall. Pull requests
        # restore the store but never save it (ADR-0011).
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          install: false
          cache: true
          save-cache: ${{ github.event_name == 'push' }}
      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install
        run: sfw pnpm install --frozen-lockfile
      - name: Audit dependencies
        # Fails on any high/critical advisory (audit.level in pnpm-workspace.yaml).
        # The single deferred advisory (braces, GHSA-vfj7-8cjw-p6xm) is listed in
        # audit.ignore there with a review date; it is reported as ignored.
        run: sfw pnpm audit
      - name: Verify package signatures
        # Verifies the ECDSA registry signatures of installed packages against the
        # keys each registry publishes at /-/npm/v1/keys.
        run: sfw pnpm audit signatures
      - name: Secret scan
        run: |
          set +e
          matches=$(git grep -lE 'ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|ctx7sk-[A-Za-z0-9_-]+|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!pnpm-lock.yaml' ':!*.lock')
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::Secret scan failed to run (git grep exit $rc)"
            exit "$rc"
          fi
          if [ -n "$matches" ]; then
            echo "::error::Potential committed secrets detected in (rotate first, then remove):"
            echo "$matches"
            exit 1
          fi
      - name: Check workflow actions are SHA-pinned
        run: bash .github/scripts/check-action-pins.sh
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Check formatting
        # Covers {apps,packages}/**/*.{ts,js,json,css,scss,html}; fix with `pnpm format`.
        run: pnpm prettier:check
      - name: Lint
        run: pnpm nx run-many --target=lint,lint-templates
      - name: Typecheck library specs
        # The unit-test builder compiles specs without full strict checks,
        # so type errors in *.spec.ts files are caught here.
        run: pnpm exec tsc --noEmit -p packages/ngx-vest-forms/tsconfig.spec.json
      - name: Build library
        run: pnpm nx run ngx-vest-forms:build --configuration=production
      - name: Test library with coverage
        # Fails when coverage drops below coverageThresholds in
        # packages/ngx-vest-forms/project.json.
        run: pnpm nx run ngx-vest-forms:test --coverage
      - name: Test other projects
        run: pnpm nx run-many --target=test --exclude=ngx-vest-forms
      - name: Browser tests
        run: pnpm nx run ngx-vest-forms:test-browser
      - name: E2E tests
        run: pnpm nx run examples-e2e:e2e -- --project=chromium
      - name: Upload Playwright report
        # The HTML report and traces (paths set in playwright.config.ts) are the
        # only way to debug a red e2e run, so keep them when a step fails.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Build examples app
        run: pnpm nx run examples:build --configuration=production --base-href=/ngx-vest-forms/
