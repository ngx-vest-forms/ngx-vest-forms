name: CI
on:
  pull_request:
    branches:
      - master
      - 'release/**'
      - 'next'
      - 'beta'
      - 'alpha'
      - 'rc'

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Lint
        run: pnpm nx run-many --target=lint
      - name: Build library
        run: pnpm nx run ngx-vest-forms:build --configuration=production
      - name: Test
        run: pnpm nx run-many --target=test
      - name: E2E tests
        run: pnpm nx run examples-e2e:e2e -- --project=chromium
        env:
          CI: true
      - name: Build examples app
        run: pnpm nx run examples:build --configuration=production --base-href=/ngx-vest-forms/
