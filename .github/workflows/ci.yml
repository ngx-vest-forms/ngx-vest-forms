name: CI
on:
  pull_request:
    branches:
      - master
      - 'release/**'
      - 'next'
      - 'beta'
      - 'alpha'
      - 'rc'

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install
        run: sfw pnpm install --frozen-lockfile
      - name: Audit dependencies
        # Fails on any high/critical advisory. The single deferred advisory
        # (braces, GHSA-vfj7-8cjw-p6xm) is listed in auditConfig.ignoreGhsas
        # in pnpm-workspace.yaml with a review date; it is reported as ignored.
        run: sfw pnpm audit --audit-level=high
      - name: Secret scan
        run: |
          set +e
          matches=$(git grep -lE 'ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|ctx7sk-[A-Za-z0-9_-]+|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!pnpm-lock.yaml' ':!*.lock')
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::Secret scan failed to run (git grep exit $rc)"
            exit "$rc"
          fi
          if [ -n "$matches" ]; then
            echo "::error::Potential committed secrets detected in (rotate first, then remove):"
            echo "$matches"
            exit 1
          fi
      - name: Check workflow actions are SHA-pinned
        run: |
          unpinned=$(grep -nE '^[[:space:]]*uses:.*@' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|#|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Workflow actions must be pinned to a 40-hex commit SHA (see CONTEXT.md: SHA-Pinned Workflow Actions):"
            echo "$unpinned"
            exit 1
          fi
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Lint
        run: pnpm nx run-many --target=lint,lint-templates
      - name: Typecheck library specs
        # The unit-test builder compiles specs without full strict checks,
        # so type errors in *.spec.ts files are caught here.
        run: pnpm exec tsc --noEmit -p packages/ngx-vest-forms/tsconfig.spec.json
      - name: Build library
        run: pnpm nx run ngx-vest-forms:build --configuration=production
      - name: Test
        run: pnpm nx run-many --target=test
      - name: Browser tests
        run: pnpm nx run ngx-vest-forms:test-browser
        env:
          CI: true
      - name: E2E tests
        run: pnpm nx run examples-e2e:e2e -- --project=chromium
        env:
          CI: true
      - name: Build examples app
        run: pnpm nx run examples:build --configuration=production --base-href=/ngx-vest-forms/
