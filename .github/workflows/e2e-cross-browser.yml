name: E2E cross-browser
# Pull requests run the e2e suite in Chromium only (ci.yml). This workflow runs
# it in Firefox and WebKit every night, and on demand, so engine-specific
# regressions surface without slowing every PR.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Read-only: the setup actions need no OIDC token, and this job publishes nothing.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .node-version
          install: false
          cache: true
      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install
        run: sfw pnpm install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.browser }})
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: E2E tests (${{ matrix.browser }})
        # 2 workers keep WebKit responsive on the 4-vCPU runner alongside vite preview.
        run: pnpm nx run examples-e2e:e2e -- --project=${{ matrix.browser }} --workers=2
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
