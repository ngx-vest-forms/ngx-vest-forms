name: Release (Production)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - release/v1.x
          - release/v2.x

permissions:
  contents: write  # For creating releases and updating changelog
  issues: write    # For commenting on issues
  pull-requests: write  # For commenting on PRs
  id-token: write  # For provenance

jobs:
  cd:
    concurrency: cd-${{ github.event.inputs.branch }}
    runs-on: ubuntu-latest
    environment: npm-publish  # Required for OIDC Trusted Publisher
    steps:
      - name: Validate branch input
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$BRANCH" ]; then
            echo "Error: No branch specified"
            exit 1
          fi
          echo "Releasing from branch: $BRANCH"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
      - name: Setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Lint
        run: pnpm nx run-many --target=lint
      - name: Build
        run: pnpm run build:ci
      - name: Test
        run: pnpm nx run-many --target=test
      - name: E2E tests
        run: pnpm nx run examples-e2e:e2e -- --project=chromium
        env:
          CI: true
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true  # Enable provenance attestation with OIDC
        run: |
          echo "Publishing release from branch: ${{ github.event.inputs.branch }}"
          pnpm exec semantic-release
