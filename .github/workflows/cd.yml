name: Release

# The only workflow that publishes to npm, through npm Trusted Publishing
# (OIDC); every published version's provenance names this file. Dispatch it
# on the branch to release (--ref). .releaserc maps each branch to its
# channel: master to @latest, release/v1.x and release/v2.x to their
# maintenance tags, beta and rc to prereleases.
#
# Two jobs, split on purpose:
#   - verify:  runs the lint, test and build tooling with a read-only token
#              and no OIDC token, and uploads the built package.
#   - release: holds the OIDC token and write access. It installs without
#              lifecycle scripts, runs only semantic-release on the
#              downloaded package, and waits for approval on the
#              npm-publish environment. Do not add build or test steps here.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute and print the next version and channel without publishing, tagging, or creating a release. Untick to publish.'
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        # install: false — the install step below runs under the Socket firewall.
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          install: false
          cache: true
      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install
        run: sfw pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Lint
        run: pnpm nx run-many --target=lint,lint-templates
      - name: Build
        run: pnpm run build:ci
      - name: Test
        run: pnpm nx run-many --target=test
      - name: E2E tests
        run: pnpm nx run examples-e2e:e2e -- --project=chromium
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/ngx-vest-forms
          include-hidden-files: true # the package's .npmignore
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish # Needs a maintainer's approval; npm's Trusted Publisher names it
    permissions:
      contents: write       # Tag and GitHub release
      issues: write         # semantic-release's "released in" comments
      pull-requests: write  # semantic-release's "released in" comments
      id-token: write       # npm Trusted Publishing and provenance
    env:
      # Keep the trailing slash: @semantic-release/npm only attempts the OIDC
      # (Trusted Publisher) token exchange when this equals
      # "https://registry.npmjs.org/" exactly, and otherwise fails with
      # ENONPMTOKEN.
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          install: false
          cache: true
          save-cache: false
      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install semantic-release
        # --ignore-scripts: no dependency lifecycle script runs in this job.
        run: sfw pnpm install --frozen-lockfile --ignore-scripts
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist/ngx-vest-forms
      - name: Check npm version
        # npm itself does the trusted-publishing token exchange at publish
        # time and needs 11.5.1 or later. @semantic-release/npm runs the npm
        # in node_modules/.bin (the root `npm` devDependency), not its own
        # copy, which pnpm does not link to the root.
        run: pnpm exec npm --version
      - name: List package contents
        # semantic-release --dry-run skips publish, so this is the dry run's
        # view of what would ship.
        run: npm pack ./dist/ngx-vest-forms --dry-run --ignore-scripts
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm exec semantic-release --dry-run
          else
            pnpm exec semantic-release
          fi
