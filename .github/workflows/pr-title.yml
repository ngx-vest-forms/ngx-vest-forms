name: PR title
# Squash merges use the PR title as the commit subject, and semantic-release
# picks the next version from commit subjects. This checks the title against
# the same commitlint config the commit-msg hook uses locally.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - master
      - 'release/**'
      - beta
      - rc

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          install: false
          cache: true
          save-cache: false
      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install
        run: sfw pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
