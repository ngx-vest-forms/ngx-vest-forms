name: Release (Prerelease/Beta)

on:
  workflow_dispatch:
    inputs:
      branch_type:
        description: 'Branch type'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable          # Use predefined branch
          - custom          # Use custom branch name

      stable_branch:
        description: 'Stable branch (when branch_type = stable)'
        required: false
        default: 'release/v3'
        type: choice
        options:
          - next
          - alpha
          - rc
          - release/v1.x
          - release/v2.x
          - release/v3

      custom_branch:
        description: 'Custom branch name (when branch_type = custom, e.g., feat/awesome-feature, fix/critical-bug)'
        required: false
        type: string

      dry_run:
        description: 'Dry run: compute and print the next version/channel without publishing, tagging, or creating a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # For creating releases and updating changelog
  issues: write    # For commenting on issues
  pull-requests: write  # For commenting on PRs
  id-token: write  # For provenance

jobs:
  prerelease:
    runs-on: ubuntu-latest
    environment: npm-publish  # Required for OIDC Trusted Publisher
    concurrency: prerelease-${{ github.event.inputs.branch_type }}-${{ github.event.inputs.stable_branch }}${{ github.event.inputs.custom_branch }}
    env:
      # Replaces the registry-url input of the former actions/setup-node step;
      # pnpm and semantic-release's npm client both read it.
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event.inputs.branch_type }}" = "stable" ]; then
            echo "branch=${{ github.event.inputs.stable_branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.event.inputs.custom_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate branch input
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          DISPATCH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$BRANCH" ]; then
            echo "Error: No branch specified"
            exit 1
          fi
          # semantic-release reads the branch from GITHUB_REF (the "Use
          # workflow from" branch), not from this input. If they differ it
          # releases on the dispatch branch's channel, e.g. a stable version
          # to @latest when dispatched from master.
          if [ "$BRANCH" != "$DISPATCH_BRANCH" ]; then
            echo "Error: dispatched from '$DISPATCH_BRANCH' but releasing '$BRANCH'."
            echo "Re-run with 'Use workflow from' (gh: --ref) set to '$BRANCH'."
            exit 1
          fi
          echo "Releasing from branch: $BRANCH"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0  # Fetch full history for semantic-release

      - name: Ensure master branch exists
        run: |
          # Semantic release needs the master branch to be available locally to calculate the version
          git fetch origin master:master

      - name: Fetch tags for semantic-release
        run: |
          # Fetch only recent tags needed for version calculation
          git fetch --depth=1 origin +refs/tags/*:refs/tags/* || true
          echo "Available recent tags:"
          git tag --sort=-version:refname | head -10 || echo "No tags found"

      - name: Fetch additional history if needed
        run: |
          # Check if we have enough history for semantic-release
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Current commit count: $COMMIT_COUNT"

          # If we don't have enough commits, fetch more (but still limited)
          if [ "$COMMIT_COUNT" -lt 50 ]; then
            echo "Fetching additional commits for better analysis..."
            if ! git fetch --deepen=50; then
              echo "Warning: git fetch --deepen=50 failed, continuing anyway" >&2
            fi
          fi
      - name: Install pnpm and Node.js
        # Reads the pnpm version from package.json's packageManager field and
        # verifies the binary against npm's signature. install: false — the
        # install step below runs under the Socket firewall.
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          install: false
      - name: Resolve pnpm store and metadata cache paths
        id: pnpm-paths
        run: |
          echo "store-path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "metadata-cache-path=$(pnpm cache path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store and metadata cache
        # Trusted events only (ADR-0001, narrowed by ADR-0009): a pull_request
        # job must never write a package-manager cache that a trusted job later
        # restores. The store is content-addressed and integrity-checked; the
        # metadata cache holds the lockfile verification log.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.pnpm-paths.outputs.store-path }}
            ${{ steps.pnpm-paths.outputs.metadata-cache-path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install
        run: sfw pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Lint
        run: pnpm nx run-many --target=lint,lint-templates
      - name: Build
        run: pnpm run build:ci
      - name: Test
        run: pnpm nx run-many --target=test
      - name: E2E tests
        run: pnpm nx run examples-e2e:e2e -- --project=chromium
        env:
          CI: true
      - name: Publish prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true  # Enable provenance attestation with OIDC
          RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: computing next version/channel for branch '$RELEASE_BRANCH' (no publish)"
            pnpm exec semantic-release --dry-run
          else
            echo "Publishing prerelease from branch: $RELEASE_BRANCH"
            pnpm exec semantic-release
          fi
